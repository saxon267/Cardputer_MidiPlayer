; Cardputer-Adv MIDI player - M5Stack Cardputer-Adv (ESP32-S3FN8, 8 MB flash)
;   pio run              build
;   pio run -t upload    flash over USB-C
[env:cardputer_midi]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_build.partitions = partitions.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0

build_src_flags =
    -O3

lib_deps =
    m5stack/M5GFX
    m5stack/M5Unified@^0.3.0
    m5stack/M5Cardputer@^1.1.1

; Dedicated build: Cardputer is USB Host, sends MIDI to an FM-1 Sloop.
; No USB-CDC serial in this build; flash the normal env to get the monitor back.
[env:cardputer_midi_usb]
extends = env:cardputer_midi
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DUSB_MIDI_HOST=1
